<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giving Guide Wireframe B</title>
<link rel="stylesheet" href="wire.css">
<style>
  .gnav { position: sticky; top: 44px; z-index: 6; display: flex; align-items: center; gap: 22px; padding: 12px 32px; background: var(--paper); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .gnav .wm { font: 700 15px/1 var(--head); letter-spacing: .1em; text-transform: uppercase; flex: none; }
  .gnav a { flex: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; text-decoration: none; min-height: 32px; }
  .gnav a::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink); }
  .gnav a.on::before { background: var(--ink); }
  .gnav small { color: var(--mid); }
  .open { display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px; padding: 44px 32px; }
  .open h1 { font-size: 54px; margin: 10px 0 16px; }
  .letter { display: grid; grid-template-columns: 96px 1fr; gap: 16px; margin-top: 18px; align-items: start; }
  .letter .ph { min-height: 110px; border-radius: 12px; }
  .letter p { margin: 0 0 8px; }
  details summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .toc { border: 1.5px solid var(--ink); border-radius: var(--r); padding: 20px 22px; columns: 2; column-gap: 28px; }
  .toc h4 { column-span: all; font-size: 15px; margin-bottom: 10px; }
  .toc a { display: grid; grid-template-columns: 28px 1fr; break-inside: avoid; text-decoration: none; padding: 6px 0; border-bottom: 1px dotted var(--line); font-size: 14px; }
  .toc a b { font: 700 16px/1.2 var(--head); }
  .chap { padding: 48px 32px 8px; border-top: 1px solid var(--line); scroll-margin-top: 100px; }
  .chap-h { display: grid; grid-template-columns: 1fr 180px; gap: 20px; align-items: end; margin-bottom: 24px; }
  .chap-h h2 { font-size: 40px; margin-top: 6px; }
  .chap-h img { width: 180px; border: 1px solid var(--line); border-radius: 6px; filter: grayscale(1) contrast(.9); display: block; }
  .chap-h figcaption { font-size: 11px; color: var(--mid); margin-top: 4px; }
  .feat { display: grid; grid-template-columns: 1.1fr 1fr; gap: 26px; align-items: stretch; margin-bottom: 26px; }
  .feat .ph { min-height: 360px; }
  .feat h3 { font-size: 34px; margin: 8px 0 12px; }
  .body { display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .body p { margin: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 26px; }
  .item { display: grid; grid-template-columns: 150px 1fr; gap: 16px; border: 1.5px solid var(--ink); border-radius: var(--r); padding: 12px; }
  .item .ph { min-height: 150px; border-radius: 10px; }
  .item h3 { font-size: 22px; margin: 4px 0 6px; }
  .item p { margin: 0 0 10px; font-size: 14px; }
  .item .body { justify-content: flex-start; gap: 8px; }
  .group { border: 1.5px solid var(--ink); border-radius: var(--r); padding: 20px; margin-bottom: 26px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; }
  .group h3 { font-size: 28px; margin: 6px 0 10px; }
  .lines { display: grid; gap: 10px; align-content: start; }
  .line { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px dotted var(--line); }
  .line b.amt { font: 700 24px/1 var(--head); }
  .line .nm { font-weight: 600; }
  .easy { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 44px 32px; border-top: 1px solid var(--line); }
  .easy h2 { grid-column: 1 / -1; font-size: 34px; }
  .easy > div { border: 1.5px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .easy h3 { font-size: 19px; }
  .easy p { margin: 0; font-size: 14px; }
  @container frame (max-width: 900px) { .pair { grid-template-columns: 1fr; } .easy { grid-template-columns: 1fr 1fr; } }
  @container frame (max-width: 700px) {
    .gnav { padding: 10px 16px; top: 0; gap: 16px; } .gnav .wm { display: none; }
    .open { grid-template-columns: 1fr; padding: 28px 16px; } .open h1 { font-size: 36px; } .toc { columns: 1; }
    .chap { padding: 36px 16px 4px; } .chap-h { grid-template-columns: 1fr; } .chap-h figure { display: none; } .chap-h h2 { font-size: 30px; }
    .feat { grid-template-columns: 1fr; } .feat .ph { min-height: 220px; } .feat h3 { font-size: 28px; }
    .item { grid-template-columns: 1fr; } .item .ph { min-height: 160px; }
    .group { grid-template-columns: 1fr; padding: 16px; } .line { grid-template-columns: 56px 1fr; } .line .btn, .line .flags { grid-column: 1 / -1; }
    .easy { grid-template-columns: 1fr; padding: 32px 16px; }
  }
</style>
</head>
<body>
<div id="tool"></div>
<div class="stage">
  <main class="frame" id="frame"></main>
  <div id="notes"></div>
</div>
<script src="gifts.js"></script>
<script src="wire.js"></script>
<script>
document.getElementById('tool').innerHTML = toolbar('B · The Guide, Page by Page');

const G = Object.fromEntries(GIFTS.map(g => [g.id, g]));
const CHAPTERS = [
  { id: 'ch1', name: 'Christmas & Water', pages: '2 to 4', thumb: 'guide-3.png', feat: 'h4c', pair: ['filter', 'ctt'], feat2: 'well' },
  { id: 'ch2', name: 'Food & Homes', pages: '5 to 6', thumb: 'guide-4.png', feat: 'f4k', pair: ['mexico', 'goats', 'home', 'cows'] },
  { id: 'ch3', name: 'Health & Faith', pages: '7 to 8', thumb: 'guide-5.png', feat: 'medicine', group: ['bedding', 'nets', 'mattress'], pair: ['bibles', 'trees'] },
  { id: 'ch4', name: 'Skills & School', pages: '9 to 10', thumb: 'guide-6.png', pair: ['welding', 'sewing', 'sports', 'coats', 'shoes', 'supplies'] },
];

const pg = g => `<span class="tag">p. ${g.page}</span>${g.top ? ' <span class="tag top">Most requested</span>' : ''}`;

const feat = (g, flip) => `<div class="feat">
  <div class="ph" style="${flip ? 'order:2' : ''}"><span>Photo from guide p. ${g.page}</span></div>
  <div class="body"><div>${pg(g)}</div><h3>${esc(g.name)}</h3><p>${esc(g.line)}</p><p class="muted">${esc(g.blurb)}</p>
  ${chipsHtml(g)}<div>${giveBtn(g)}</div>${flagsHtml(g)}</div></div>`;

const item = g => `<article class="item"><div class="ph"><span>p. ${g.page}</span></div>
  <div class="body"><div>${pg(g)}</div><h3>${esc(g.name)}</h3><p>${esc(g.line)}</p>${g.goal ? `<div class="small muted">Goal: ${esc(g.goal)}</div>` : ''}
  ${chipsHtml(g)}<div>${giveBtn(g, 'Give', 'sm')}</div>${flagsHtml(g)}</div></article>`;

const group = ids => `<div class="group rel">${pin(4, true)}
  <div><div><span class="tag">p. 8</span></div><h3>Health & Wellness</h3>
  <p>In East Africa, malaria remains a major health crisis for children. Nets, bedding, and mattresses help children rest safely and stay well.</p>
  <p class="small muted">Goal: $5,000</p><div class="ph" style="min-height:160px;margin-top:12px"><span>Photo pair from guide p. 8</span></div></div>
  <div class="lines">${ids.map(id => { const g = G[id]; return `<div class="line"><b class="amt">${money(g.prices[0].amt)}</b>
    <div><div class="nm">${esc(g.name)}</div><div class="small muted">${esc(g.line)}</div>${flagsHtml(g)}</div>${giveBtn(g, 'Give', 'sm')}</div>`; }).join('')}</div></div>`;

const chapter = (c, i) => `<section class="chap rel" id="${c.id}">${i === 0 ? pin(3, true) : ''}
  <div class="chap-h"><div><div class="kick">Pages ${c.pages}</div><h2>${esc(c.name)}</h2></div>
  <figure style="margin:0"><img src="${c.thumb}" alt="Printed guide spread, pages ${c.pages}"><figcaption>Matches printed spread</figcaption></figure></div>
  ${c.feat ? feat(G[c.feat]) : ''}
  ${c.group ? group(c.group) : ''}
  <div class="pair">${c.pair.map(id => item(G[id])).join('')}</div>
  ${c.feat2 ? feat(G[c.feat2], true) : ''}</section>`;

document.getElementById('frame').innerHTML = `
  ${siteHead()}
  <nav class="gnav rel" aria-label="Guide chapters"><span class="wm">Giving Guide 2026</span>
    ${CHAPTERS.map((c, i) => `<a href="#${c.id}" class="${i ? '' : 'on'}">${esc(c.name)} <small>pp. ${c.pages}</small></a>`).join('')}${pin(1)}</nav>

  <section class="open rel">${pin(2, true)}
    <div>
      <div class="kick">Christmas 2026</div>
      <h1>Bring hope home this Christmas</h1>
      <p>Choose a gift from our Giving Guide and help restore dignity, health, joy, and love for children and families in the communities we serve.</p>
      <div class="letter"><div class="ph"><span>Tom</span></div>
        <div><p class="small"><b>A thank you from our founder.</b> Because of you, thousands of kids and families around the world will experience hope this season.</p>
        <details><summary>Read the full letter</summary><div class="txt"></div><div class="txt"></div><div class="txt" style="width:70%"></div></details>
        <p class="small muted">Tom Eggum, Founder and President</p></div></div>
    </div>
    <nav class="toc" aria-label="In this guide"><h4>In this guide</h4>
      ${GIFTS.map(g => `<a href="#${CHAPTERS.find(c => c.feat === g.id || c.feat2 === g.id || (c.pair || []).includes(g.id) || (c.group || []).includes(g.id)).id}"><b>${g.page}</b><span>${esc(g.name)}</span></a>`).join('')}
    </nav>
  </section>

  ${CHAPTERS.map(chapter).join('')}

  <section class="easy rel">${pin(5, true)}
    <h2>Easy giving options</h2>
    <div><h3>Where most needed</h3><p>Let your gift meet the greatest need across our programs.</p><a class="btn sm" href="${giveUrl(MOST_NEEDED.form)}" ${ext}>Give</a></div>
    <div><h3>Mission trips 2027</h3><p>See upcoming dates and set up a fundraising page for your trip.</p><a class="btn ghost sm" href="https://h4ki.org/trips" ${ext}>Apply now</a></div>
    <div><h3>Create a free will</h3><p>A free will building tool. Most people finish in 20 minutes.</p><a class="btn ghost sm" href="https://freewill.com/h4ki" ${ext}>Start</a></div>
    <div><h3>Give by mail or phone</h3><p class="small">PO Box 74010, Phoenix, AZ 85087<br>623.979.5516<br>info@h4ki.org</p><span class="btn ghost sm">Download PDF guide</span></div>
  </section>
  ${siteFoot()}`;

document.getElementById('notes').innerHTML = notesHtml('B · Page by Page', [
  'Slim chapter bar with outlined dots, one per printed spread. Dot fills as you scroll (Elementor menu anchor, or a sticky container with anchor links).',
  'Opening mirrors guide page 2: a short thank you from Tom with the full letter tucked behind a toggle, and the guide\'s own table of contents with page numbers.',
  'Each chapter matches a printed spread, in print order, with a small grayscale thumbnail so print readers recognize where they are. One featured gift per chapter gets the full guide story.',
  'Health & Wellness stays grouped like page 8: one story, three line items, one $5,000 goal. Bedding has no Givecloud form yet, so its button reads "Form needed."',
  'The guide back cover, made clickable: trips, FreeWill, and mail or phone giving for supporters who prefer it.',
], [
  'Longest page of the three. Worth it if many visitors arrive from the printed guide; analytics on h4ki.org/GivingGuide QR traffic would tell us.',
  'Is the letter from Tom still wanted online, or print only?',
]);
wireUp();

const links = [...document.querySelectorAll('.gnav a')];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id));
}), { rootMargin: '-40% 0px -55% 0px' });
CHAPTERS.forEach(c => io.observe(document.getElementById(c.id)));
</script>
</body>
</html>
